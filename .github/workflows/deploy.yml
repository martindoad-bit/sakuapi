# 自动部署：main 分支任何 commit（网页端保存/删除、本地 push）→ 构建 → 上线。
# 这是全站唯一部署通道，保证 GitHub 内容和线上页面永远一致。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑最新的一次；旧的排队构建直接取消
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=sakuapi --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
